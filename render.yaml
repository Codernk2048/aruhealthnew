services:
  - type: web
    name: aruhealth-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
    startCommand: npm run start -w @aruhealth/api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "http://localhost:3000,https://aruhealth-web.vercel.app,https://*.vercel.app"
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_WORKSPACE
        value: "@aruhealth/api"
